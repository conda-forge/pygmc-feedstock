{% set name = "pygmc" %}
{% set version = "0.14.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pygmc-{{ version }}.tar.gz
  sha256: 502a86cac43ea4d2247eb0fe1b54773c99232eb473b9d5f918cbffd012821fe5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - pyserial >=3.4

test:
  imports:
    - pygmc
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Wikilicious/pygmc
  summary: Python package for Geiger–Müller Counter (GMC)
  dev_url: https://github.com/Wikilicious/pygmc
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Wikilicious
